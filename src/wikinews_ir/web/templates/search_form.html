<form id="search-form" role="search" action="/" method="get">
<label for="q" class="sr-only">{{ 'Cerca in tutte le notizie' if folder else 'Cerca nelle notizie' }}</label>
<div class="search-row">
<svg class="icon" aria-hidden="true">
<use href="/static/explorer-icons.svg#search">
</use>
</svg>
<input id="q" name="q" type="search" placeholder="{{ 'Cerca in tutte le notizie' if folder else 'Cerca notizie, luoghi, argomenti…' }}" maxlength="250" required>
<button type="submit">Cerca</button>
<div class="filter-control">
<button type="button" id="filters" aria-controls="search-options" aria-expanded="false">Filtri</button>
<div id="search-options" hidden>
<label for="profile">Modalità di ricerca</label>
<select id="profile" name="profile">{% set names = {'E0':'Standard','E1':'Analisi italiana','E2':'Priorità al titolo','E3':'Tolleranza ai refusi','E4':'Frasi'} %}
{% for profile in profiles %}<option value="{{ profile }}">{{ names.get(profile,profile) }}</option>{% endfor %}{% if semantic_enabled() %}<option value="semantic">Ricerca semantica</option>{% endif %}<option value="live">Cerca su Wikinotizie</option></select>
<p id="profile-help">
</p>
<fieldset class="year-range"><legend>Periodo di pubblicazione</legend>
<label>Da anno<input type="number" min="1" max="9999" step="1" name="year_from"></label>
<label>Ad anno<input type="number" min="1" max="9999" step="1" name="year_to"></label>
</fieldset>
</div></div></div>
</form>
