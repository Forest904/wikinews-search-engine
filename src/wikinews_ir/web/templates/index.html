<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wikinotizie — Ricerca (demo)</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Ingegneria dei Dati · Homework 4</p>
      <h1>Ricerca Wikinotizie</h1>
      <p class="muted">Demo su cinque notizie sintetiche: i contenuti non provengono dal dump Wikinotizie.</p>
    </header>
    <form id="search-form">
      <label for="q">Cerca nelle notizie</label>
      <div class="search-row">
        <input id="q" name="q" placeholder="Es. terremoto" minlength="1" maxlength="250" required>
        <button type="submit">Cerca</button>
      </div>
      <label for="profile">Profilo di retrieval</label>
      <select id="profile" name="profile">
        {% for profile in profiles %}<option value="{{ profile }}">{{ profile }}</option>{% endfor %}
      </select>
    </form>
    <div id="status" class="muted" role="status">Inserisci una parola per cercare nelle fixture.</div>
    <ol id="results" aria-live="polite"></ol>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
