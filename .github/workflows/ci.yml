name: Python quality checks
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q

  retrieval-and-browser:
    runs-on: ubuntu-latest
    env:
      ELASTIC_PASSWORD: ci-local-test-password
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      RUN_INTEGRATION: "1"
      RUN_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: docker compose up -d --wait elasticsearch
      - run: uv run --locked pytest tests/integration tests/e2e -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-debug
          path: output/playwright/
      - run: docker compose down
        if: always()
