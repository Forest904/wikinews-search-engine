[project]
name = "wikinews-ir"
version = "0.1.0"
description = "Italian Wikinews search engine and reproducible IR evaluation (Homework 4)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "elasticsearch>=9.0,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ir-measures>=0.3,<1",
  "jinja2>=3.1,<4",
  "lxml>=5,<7",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
wikinews-ir = "wikinews_ir.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikinews_ir"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
